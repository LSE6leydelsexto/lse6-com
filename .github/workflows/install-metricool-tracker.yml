name: Install Metricool tracker

on:
  push:
    branches: [metricool-tracker]
    paths:
      - '.github/workflows/install-metricool-tracker.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: metricool-tracker
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inject Metricool tracker without rewriting existing HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          marker = b'tracker.metricool.com/resources/be.js'
          snippet_lf = (
              b'<!-- METRICOOL WEB ANALYTICS -->\n'
              b'<script>function loadScript(a){var b=document.getElementsByTagName("head")[0],c=document.createElement("script");c.type="text/javascript",c.src="https://tracker.metricool.com/resources/be.js",c.onreadystatechange=a,c.onload=a,b.appendChild(c)}loadScript(function(){beTracker.t({hash:"dc576c122035ecc055d9f184973e407"})});</script>'
          )

          html_files = sorted(root.rglob('*.html'))
          if not html_files:
              raise SystemExit('No HTML files found')

          patched = []
          already = []
          skipped = []

          for path in html_files:
              data = path.read_bytes()
              if marker in data:
                  already.append(path.as_posix())
                  continue

              pos = data.lower().find(b'</head>')
              if pos < 0:
                  skipped.append(path.as_posix())
                  continue

              newline = b'\r\n' if b'\r\n' in data[:4096] else b'\n'
              snippet = snippet_lf.replace(b'\n', newline)
              path.write_bytes(data[:pos] + snippet + newline + data[pos:])
              patched.append(path.as_posix())

          headers = root / '_headers'
          h = headers.read_text(encoding='utf-8')
          old_script = "script-src 'self' 'unsafe-inline' 'unsafe-eval';"
          new_script = "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://tracker.metricool.com;"
          old_connect = "connect-src 'self';"
          new_connect = "connect-src 'self' https://tracker.metricool.com https://*.metricool.com;"

          if new_script not in h:
              if old_script not in h:
                  raise SystemExit('Expected script-src CSP token not found')
              h = h.replace(old_script, new_script, 1)

          if new_connect not in h:
              if old_connect not in h:
                  raise SystemExit('Expected connect-src CSP token not found')
              h = h.replace(old_connect, new_connect, 1)

          headers.write_text(h, encoding='utf-8')

          # Verify byte-for-byte style patching properties: one tracker per HTML page with a head.
          tracked = 0
          for path in html_files:
              data = path.read_bytes()
              if b'</head>' in data.lower():
                  count = data.count(marker)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one Metricool tracker, found {count}')
                  tracked += 1

          if tracked < 20:
              raise SystemExit(f'Unexpectedly low tracked-page count: {tracked}')

          print(f'Patched HTML pages: {len(patched)}')
          print(f'Already tracked: {len(already)}')
          print(f'Skipped without </head>: {len(skipped)}')
          print(f'Total tracked HTML pages: {tracked}')
          if skipped:
              print('Skipped:', ', '.join(skipped))
          PY

      - name: Validate site after tracker injection
        shell: bash
        run: |
          python tools/validate_music_routes.py
          python tools/validate_inline_js.py
          python -m unittest tools/test_submit_indexnow.py
          git diff --check

      - name: Remove one-time installer and commit only the site integration
        shell: bash
        run: |
          rm .github/workflows/install-metricool-tracker.yml
          git config user.name "LSE6 Metricool Installer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Metricool web analytics"
          git push origin HEAD:metricool-tracker
