name: Validate LSE6 web surface

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lse6-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate routes, sitemaps and catalog
        run: python tools/validate_music_routes.py
      - name: Validate inline JavaScript
        run: python tools/validate_inline_js.py
      - name: Validate IndexNow notification logic
        run: python -m unittest tools/test_submit_indexnow.py

  notify-indexnow:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify IndexNow after validation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/submit_indexnow.py --all
          else
            python tools/submit_indexnow.py --before "${{ github.event.before }}" --after "${{ github.sha }}"
          fi
